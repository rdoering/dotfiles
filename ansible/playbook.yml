---
- name: Machine setup (mise/ansible cascade — items mise cannot provide)
  hosts: localhost
  gather_facts: true

  vars:
    ansible_become_timeout: 10
    # Only tools mise's registry/github backend cannot install as standalone
    # binaries (unzip/p7zip/sysbench have no suitable GitHub release
    # binaries), plus anything needing OS-level integration (login shell).
    # btop: upstream ships linux-only binaries (no darwin release artifact),
    # so mise cannot provide it on macOS; installed via the OS package
    # manager on every platform for consistency.
    packages:
      common:
        - zsh
        - unzip
        - p7zip
        - sysbench
        - btop

  tasks:
    - name: Get my user
      ansible.builtin.set_fact:
        remote_regular_user: "{{ ansible_env.get('SUDO_USER', ansible_user_id) }}"

    - name: Install packages (macOS)
      community.general.homebrew:
        name: "{{ packages.common }}"
        state: present
      when: ansible_facts['os_family'] == "Darwin"
      become: false

    - name: Install packages (Debian/Ubuntu)
      ansible.builtin.apt:
        name: "{{ packages.common }}"
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == "Debian"
      become: true

    - name: Set zsh path fact
      ansible.builtin.set_fact:
        zsh_path: "{{ '/usr/local/bin/zsh' if ansible_facts['os_family'] == 'Darwin' else '/usr/bin/zsh' }}"

    - name: Change shell to zsh
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        shell: "{{ zsh_path }}"
      become: true

    - name: Ensure fonts directory
      ansible.builtin.file:
        path: "{{ '~/Library/Fonts' if ansible_facts['os_family'] == 'Darwin' else '/home/' + remote_regular_user + '/.fonts' }}"
        state: directory
        mode: "0755"
        owner: "{{ remote_regular_user }}"

    - name: Check if JetBrains Mono exists
      ansible.builtin.stat:
        path: "{{ '~/Library/Fonts/JetBrainsMonoNerdFontMono' if ansible_facts['os_family'] == 'Darwin' else '/home/' + remote_regular_user + '/.fonts/JetBrainsMonoNerdFontMono' }}"
      register: jetbrains_mono_exists

    - name: Download JetBrains Mono
      when: not jetbrains_mono_exists.stat.exists
      ansible.builtin.unarchive:
        src: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/JetBrainsMono.zip
        dest: "{{ '~/Library/Fonts' if ansible_facts['os_family'] == 'Darwin' else '/home/' + remote_regular_user + '/.fonts/' }}"
        remote_src: true
        mode: "0755"
        owner: "{{ remote_regular_user }}"
